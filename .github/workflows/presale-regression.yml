name: Presale regression
on:
  push:
    paths:
      - 'assets/js/storage.js'
      - 'assets/js/shop-kakao.js'
      - 'tests/presale-regression.cjs'
      - '.github/workflows/presale-regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/presale-regression.cjs
