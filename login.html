<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>매물관리 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/login-warm.css?v=20261127-paperlogy" />
  <script src="assets/js/storage.js?v=20261006-ktop-diary1"></script>
  <script data-office-theme>document.documentElement.dataset.officeTheme = OfficeConfig.id;</script>
<script src="assets/js/office-brand.js?v=20261108-ktop-match1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="warm-login">
  <main class="wl-wrap">
    <header class="wl-hero">
      <p class="wl-hello" id="wlHello">좋은 하루예요, 소장님</p>
      <h1>오늘도 파이팅하시고<br>좋은 하루 되세요</h1>
      <svg class="wl-art" viewBox="0 0 440 150" aria-hidden="true" focusable="false">
        <circle cx="352" cy="46" r="26" fill="#F2C38B"></circle>
        <path d="M0 110 C 80 70, 150 80, 220 100 S 360 80, 440 96 L 440 150 L 0 150 Z" fill="#E7D6BC"></path>
        <rect class="acc" x="70" y="66" width="34" height="58" rx="6" opacity=".85"></rect>
        <rect class="acc" x="110" y="44" width="40" height="80" rx="6" opacity=".6"></rect>
        <rect x="156" y="78" width="30" height="46" rx="6" fill="#C9A47A" opacity=".8"></rect>
        <rect x="250" y="74" width="44" height="50" rx="6" fill="#C9A47A" opacity=".7"></rect>
        <path class="acc" d="M300 124 L 322 96 L 344 124 Z" opacity=".55"></path>
        <path d="M0 128 C 100 112, 200 130, 300 118 S 400 120, 440 116 L 440 150 L 0 150 Z" fill="#DCC6A5"></path>
      </svg>
      <script data-greeting>
        (function () {
          var h = new Date().getHours();
          document.getElementById("wlHello").textContent =
            h >= 5 && h < 11 ? "좋은 아침이에요, 소장님" :
            h >= 11 && h < 17 ? "좋은 오후예요, 소장님" :
            h >= 17 && h < 22 ? "좋은 하루예요, 소장님" : "늦은 시간까지 수고 많으세요, 소장님";
        })();
      </script>
    </header>
    <section class="wl-sheet login-card">
      <div class="wl-offices" role="group" aria-label="부동산 선택">
        <button type="button" class="wl-office" data-office="hitop" aria-pressed="false">하이탑</button>
        <button type="button" class="wl-office" data-office="ktop" aria-pressed="false">케이탑</button>
      </div>
      <select id="officeSelect" hidden aria-hidden="true" tabindex="-1">
        <option value="hitop">하이탑부동산</option>
        <option value="ktop">케이탑부동산</option>
      </select>
      <p id="officeBrand" class="wl-sub">하이탑부동산 매물관리</p>
      <div id="resetSuccessBanner" class="wl-banner" style="display:none;">비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.</div>

      <div id="emailView">
        <input id="loginEmail" class="wl-field" type="email" placeholder="이메일" autocomplete="username" aria-label="이메일" />
        <div id="loginPanel">
          <input id="loginPassword" class="wl-field" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" />
          <div id="loginError" class="wl-error"></div>
          <button id="loginBtn" class="wl-btn wl-btn-primary">로그인</button>
          <button id="forgotPwLink" type="button" class="wl-btn wl-btn-text">비밀번호를 잊으셨나요?</button>
        </div>
        <div id="forgotPanel" style="display:none;">
          <p class="wl-note" style="margin:0 0 12px;">위 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
          <div id="forgotStatus" class="wl-error" style="color:var(--wl-ink);"></div>
          <button id="sendResetBtn" type="button" class="wl-btn wl-btn-primary">재설정 메일 보내기</button>
          <button id="backToLoginLink" type="button" class="wl-btn wl-btn-text">로그인으로 돌아가기</button>
        </div>
        <p id="officeNotice" class="wl-note"></p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      document.documentElement.dataset.officeTheme = OfficeConfig.id;
      // 재설정 링크로 사용할 고정 주소 — Supabase 프로젝트의 Auth 리다이렉트 허용 목록에도
      // 이 주소가 등록되어 있어야 실제로 reset-password.html로 이동한다.
      const RESET_REDIRECT_URL = OfficeConfig.urlFor("reset-password.html");

      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const officeSelect = document.getElementById("officeSelect");
      officeSelect.value = OfficeConfig.id;
      document.getElementById("officeBrand").textContent = OfficeConfig.label + " 매물관리";
      // 하이탑·케이탑 선택 버튼: 고르면 해당 부동산 로그인으로 바꾼다.
      document.querySelectorAll(".wl-office").forEach(function (btn) {
        const on = btn.dataset.office === OfficeConfig.id;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.addEventListener("click", function () {
          if (on || officeSelect.disabled) return;
          officeSelect.value = btn.dataset.office;
          officeSelect.dispatchEvent(new Event("change"));
        });
      });
      document.getElementById("officeNotice").textContent = OfficeConfig.id === "ktop"
        ? "케이탑 계정으로 로그인합니다. 고객과 소유주·연락처는 케이탑에서 별도로 관리합니다."
        : "하이탑 계정으로 로그인합니다.";
      if (OfficeConfig.id === "ktop" && new URLSearchParams(location.search).get("from") === "admin-switch") {
        document.getElementById("officeNotice").textContent = "하이탑 관리자 전환: 하이탑에 로그인되어 있으면 케이탑 비밀번호 없이 바로 열립니다.";
      }
      document.title = "매물관리 로그인 - " + OfficeConfig.label;
      officeSelect.addEventListener("change", function () {
        const target = new URL(location.href);
        target.searchParams.set("office", officeSelect.value);
        target.searchParams.delete("reset");
        location.replace(target.href);
      });
      const emailEl = document.getElementById("loginEmail");
      const pwEl = document.getElementById("loginPassword");
      const errEl = document.getElementById("loginError");
      const btnEl = document.getElementById("loginBtn");
      const loginPanelEl = document.getElementById("loginPanel");
      const forgotPanelEl = document.getElementById("forgotPanel");
      const forgotLinkEl = document.getElementById("forgotPwLink");
      const backToLoginEl = document.getElementById("backToLoginLink");
      const sendResetBtnEl = document.getElementById("sendResetBtn");
      const forgotStatusEl = document.getElementById("forgotStatus");
      const resetBannerEl = document.getElementById("resetSuccessBanner");

      if (new URLSearchParams(location.search).get("reset") === "success") {
        resetBannerEl.style.display = "block";
      }

      // 로그인 후에는 항상 카테고리별 매물·자료 관리 메인을 연다.
      function getRedirectTarget() {
        return OfficeConfig.urlFor("property-main.html?category=all&ui=20261006-brand2");
      }

      async function tryLogin() {
        if (btnEl.disabled) return;
        errEl.textContent = "";
        const email = emailEl.value.trim();
        const password = pwEl.value;
        if (!email || !password) { errEl.textContent = "이메일과 비밀번호를 입력하세요."; return; }
        btnEl.disabled = true;
        officeSelect.disabled = true;
        btnEl.textContent = "로그인 중...";
        try {
          const { error } = await authClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          const { data, error: userError } = await authClient.auth.getUser();
          if (userError || !data.user) throw userError || new Error();
          if (OfficeConfig.id === "ktop") {
            const { data: members, error: memberError } = await authClient.from("office_members").select("email").eq("email", data.user.email.toLowerCase());
            if (memberError || !members || !members.length) {
              await authClient.auth.signOut();
              errEl.textContent = "케이탑 매물관리 사용 권한이 없습니다. 관리자에게 문의하세요.";
              return;
            }
          }
          if (OfficeConfig.id === "hitop") await linkKtopForAdmin(email, password);
          pwEl.value = "";
          location.replace(getRedirectTarget());
        } catch (_) {
          errEl.textContent = "로그인에 실패했습니다. 선택한 부동산의 이메일·비밀번호와 인터넷 연결을 확인하세요.";
          pwEl.value = "";
          pwEl.focus();
        } finally {
          btnEl.disabled = false;
          officeSelect.disabled = false;
          btnEl.textContent = "로그인";
        }
      }

      // 하이탑(관리자)으로 로그인하면 같은 이메일·비밀번호로 케이탑 프로젝트에도 조용히 로그인해 둔다.
      // 케이탑에 같은 계정이 없거나 회원이 아니면 기존 케이탑 세션을 그대로 둔다(하이탑 로그인은 계속 진행).
      async function linkKtopForAdmin(email, password) {
        const ktopKey = "sb-enefadyhmhfphtochlku-auth-token";
        let previous = null;
        try { previous = localStorage.getItem(ktopKey); } catch (_) {}
        try {
          const ktopClient = window.supabase.createClient("https://enefadyhmhfphtochlku.supabase.co", "sb_publishable__8Ru0l0wfQo8e5Ljq1ZQ7Q_LYtCAP-p");
          const { data, error } = await ktopClient.auth.signInWithPassword({ email, password });
          if (error || !data.user) return;
          const { data: members, error: memberError } = await ktopClient.from("office_members").select("email").eq("email", data.user.email.toLowerCase());
          if (memberError || !members || !members.length) {
            await ktopClient.auth.signOut({ scope: "local" });
            if (previous) localStorage.setItem(ktopKey, previous);
          }
        } catch (_) {}
      }

      function showForgotPanel() {
        resetBannerEl.style.display = "none";
        loginPanelEl.style.display = "none";
        forgotPanelEl.style.display = "block";
        forgotStatusEl.textContent = "";
      }

      function showLoginPanel() {
        forgotPanelEl.style.display = "none";
        loginPanelEl.style.display = "block";
        errEl.textContent = "";
      }

      async function sendResetEmail() {
        const email = emailEl.value.trim();
        if (!email) {
          forgotStatusEl.style.color = "#e05252";
          forgotStatusEl.textContent = "이메일을 입력하세요.";
          return;
        }
        sendResetBtnEl.disabled = true;
        sendResetBtnEl.textContent = "보내는 중...";
        const { error } = await authClient.auth.resetPasswordForEmail(email, { redirectTo: RESET_REDIRECT_URL });
        sendResetBtnEl.disabled = false;
        sendResetBtnEl.textContent = "재설정 메일 보내기";
        // 존재하지 않는 이메일이어도 동일한 안내만 보여준다(이메일 존재 여부 노출 방지).
        forgotStatusEl.style.color = error ? "#e05252" : "#162041";
        forgotStatusEl.textContent = error
          ? "메일 발송에 실패했습니다. 잠시 후 다시 시도하세요."
          : "입력하신 이메일로 재설정 링크를 보냈습니다. 메일함을 확인해주세요.";
      }

      btnEl.addEventListener("click", tryLogin);
      [emailEl, pwEl].forEach(function (el) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") tryLogin();
        });
      });
      forgotLinkEl.addEventListener("click", showForgotPanel);
      backToLoginEl.addEventListener("click", showLoginPanel);
      sendResetBtnEl.addEventListener("click", sendResetEmail);

      // 6자리 간편로그인은 업무센터와 함께 없앴다(이메일+비밀번호만 사용). 예전에 등록한 기기 표시는 지운다.
      try { localStorage.removeItem("hitopPinDevice"); } catch (_) {}
      document.cookie = "hitopPinUnlocked=; path=/; Max-Age=0";

      // 하이탑 관리자 전환: 하이탑 로그인(관리자)이 살아 있으면 케이탑 비밀번호 없이
      // 케이탑 서버 함수(admin-bridge)가 하이탑 관리자임을 직접 확인한 뒤 케이탑을 바로 연다.
      // 하이탑 -> 케이탑 한 방향만 가능하다. 케이탑 계정으로는 하이탑에 들어가거나 하이탑 자료를 고칠 수 없다.
      const HITOP_REF = "xaxbkdnrzsghsabkdvzj";
      function hitopAdminReady() {
        try {
          return !!localStorage.getItem("sb-" + HITOP_REF + "-auth-token");
        } catch (_) { return false; }
      }
      async function openKtopAsHitopAdmin() {
        try {
          const hitopClient = window.supabase.createClient("https://" + HITOP_REF + ".supabase.co", "sb_publishable_gqNFRMHb6yYKvqFnQurPKQ_7gGhURVd", { auth: { autoRefreshToken: false, detectSessionInUrl: false } });
          const { data: sessionData } = await hitopClient.auth.getSession();
          const token = sessionData && sessionData.session && sessionData.session.access_token;
          if (!token) return false;
          const res = await fetch(SUPABASE_URL + "/functions/v1/admin-bridge", {
            method: "POST",
            headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
            body: "{}"
          });
          if (!res.ok) return false;
          const out = await res.json();
          if (!out || !out.tokenHash) return false;
          const { error } = await authClient.auth.verifyOtp({ token_hash: out.tokenHash, type: "email" });
          return !error;
        } catch (_) { return false; }
      }
      const switchParams = new URLSearchParams(location.search);
      const fromAdminSwitch = switchParams.get("from") === "admin-switch";
      if (OfficeConfig.id === "ktop" && (fromAdminSwitch || switchParams.has("redirect")) && hitopAdminReady()) {
        const noticeEl = document.getElementById("officeNotice");
        const prevNotice = noticeEl.textContent;
        noticeEl.textContent = "하이탑 관리자 확인 중... 잠시만 기다려 주세요.";
        btnEl.disabled = true;
        openKtopAsHitopAdmin().then(function (ok) {
          if (ok) { location.replace(getRedirectTarget()); return; }
          btnEl.disabled = false;
          noticeEl.textContent = fromAdminSwitch
            ? "하이탑 관리자 확인에 실패했습니다. 하이탑에 다시 로그인한 뒤 '케이탑 보기'를 눌러 주세요."
            : prevNotice;
        });
      }

      // 기존 하이탑 세션이 있어도 부동산을 선택할 수 있도록 로그인 화면을 유지한다.
      if (OfficeConfig.id === "ktop") emailEl.value = "ktop2027@gmail.com";
      emailEl.focus();
    })();
  </script>
</body>
</html>
