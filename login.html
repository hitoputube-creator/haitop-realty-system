<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>매물관리 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <script src="assets/js/storage.js?v=20261006-ktop-diary1"></script>
<script src="assets/js/office-brand.js?v=20261006-brand-layout"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:radial-gradient(circle at top, var(--panel2) 0, var(--bg) 45%, var(--bg2) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--txt);">
  <div style="width:100%;max-width:320px;">
    <div style="text-align:center;margin-bottom:36px;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#d8b84a,#f0c040);border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:1px solid rgba(216,184,74,0.45);">🏢</div>
      <div id="officeBrand" style="font-size:1.4rem;font-weight:800;color:var(--gold);letter-spacing:0.5px;">HITOP 부동산</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:4px;">관리자 로그인</div>
    </div>
    <div id="resetSuccessBanner" style="display:none;font-size:0.82rem;color:var(--gold);text-align:center;background:var(--gold2);border:1px solid rgba(216,184,74,0.25);border-radius:10px;padding:10px 12px;margin-bottom:14px;">
      비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.
    </div>

    <label for="officeSelect" style="display:block;margin-bottom:8px;">로그인할 부동산</label>
    <select id="officeSelect" style="width:100%;padding:12px;border-radius:10px;background:var(--panel);color:var(--txt);border:1px solid var(--line);margin-bottom:14px;">
      <option value="hitop">하이탑부동산</option>
      <option value="ktop">케이탑부동산</option>
    </select>
    <p id="officeNotice" style="font-size:0.8rem;color:var(--sub);line-height:1.5;margin-bottom:16px;"></p>
    <input id="loginEmail" type="email" placeholder="이메일" autocomplete="username"
      style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);outline:none;margin-bottom:10px;" />

    <div id="loginPanel">
      <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password"
        style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);outline:none;margin-bottom:10px;" />
      <div id="loginError" style="font-size:0.82rem;color:var(--danger);text-align:center;min-height:20px;margin-bottom:10px;"></div>
      <button id="loginBtn" style="width:100%;padding:14px;background:var(--gold);color:#071422;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">로그인</button>
      <button id="forgotPwLink" type="button" style="width:100%;padding:10px;background:none;border:none;color:var(--sub);font-size:0.8rem;cursor:pointer;margin-top:6px;">비밀번호를 잊으셨나요?</button>
    </div>

    <div id="forgotPanel" style="display:none;">
      <div style="font-size:0.8rem;color:var(--sub);text-align:center;margin-bottom:14px;line-height:1.5;">
        위 이메일로 비밀번호 재설정 링크를 보내드립니다.
      </div>
      <div id="forgotStatus" style="font-size:0.82rem;color:var(--gold);text-align:center;min-height:20px;margin-bottom:10px;"></div>
      <button id="sendResetBtn" type="button" style="width:100%;padding:14px;background:var(--gold);color:#071422;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">재설정 메일 보내기</button>
      <button id="backToLoginLink" type="button" style="width:100%;padding:10px;background:none;border:none;color:var(--sub);font-size:0.8rem;cursor:pointer;margin-top:6px;">로그인으로 돌아가기</button>
    </div>
  </div>

  <script>
    (function () {
      // 재설정 링크로 사용할 고정 주소 — Supabase 프로젝트의 Auth 리다이렉트 허용 목록에도
      // 이 주소가 등록되어 있어야 실제로 reset-password.html로 이동한다.
      const RESET_REDIRECT_URL = OfficeConfig.urlFor("reset-password.html");

      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const officeSelect = document.getElementById("officeSelect");
      officeSelect.value = OfficeConfig.id;
      document.getElementById("officeBrand").textContent = OfficeConfig.id === "ktop" ? officeManagementTitle : OfficeConfig.brand + " 부동산";
      document.getElementById("officeNotice").textContent = OfficeConfig.id === "ktop"
        ? "케이탑 계정으로 로그인합니다. 고객과 소유주·연락처는 케이탑에서 별도로 관리합니다."
        : "하이탑 계정으로 로그인합니다.";
      document.title = "매물관리 로그인 - " + OfficeConfig.label;
      officeSelect.addEventListener("change", function () {
        const target = new URL(location.href);
        target.searchParams.set("office", officeSelect.value);
        target.searchParams.delete("reset");
        location.replace(target.href);
      });
      const emailEl = document.getElementById("loginEmail");
      const pwEl = document.getElementById("loginPassword");
      const errEl = document.getElementById("loginError");
      const btnEl = document.getElementById("loginBtn");
      const loginPanelEl = document.getElementById("loginPanel");
      const forgotPanelEl = document.getElementById("forgotPanel");
      const forgotLinkEl = document.getElementById("forgotPwLink");
      const backToLoginEl = document.getElementById("backToLoginLink");
      const sendResetBtnEl = document.getElementById("sendResetBtn");
      const forgotStatusEl = document.getElementById("forgotStatus");
      const resetBannerEl = document.getElementById("resetSuccessBanner");

      if (new URLSearchParams(location.search).get("reset") === "success") {
        resetBannerEl.style.display = "block";
      }

      // 로그인 후에는 항상 카테고리별 매물·자료 관리 메인을 연다.
      function getRedirectTarget() {
        return OfficeConfig.urlFor("property-main.html?category=all&ui=20261006-brand2");
      }

      async function tryLogin() {
        if (btnEl.disabled) return;
        errEl.textContent = "";
        const email = emailEl.value.trim();
        const password = pwEl.value;
        if (!email || !password) { errEl.textContent = "이메일과 비밀번호를 입력하세요."; return; }
        btnEl.disabled = true;
        officeSelect.disabled = true;
        btnEl.textContent = "로그인 중...";
        try {
          const { error } = await authClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          const { data, error: userError } = await authClient.auth.getUser();
          if (userError || !data.user) throw userError || new Error();
          if (OfficeConfig.id === "ktop") {
            const { data: members, error: memberError } = await authClient.from("office_members").select("email").eq("email", data.user.email.toLowerCase());
            if (memberError || !members || !members.length) {
              await authClient.auth.signOut();
              errEl.textContent = "케이탑 매물관리 사용 권한이 없습니다. 관리자에게 문의하세요.";
              return;
            }
          }
          location.replace(getRedirectTarget());
        } catch (_) {
          errEl.textContent = "로그인에 실패했습니다. 선택한 부동산의 이메일·비밀번호와 인터넷 연결을 확인하세요.";
          pwEl.value = "";
          pwEl.focus();
        } finally {
          btnEl.disabled = false;
          officeSelect.disabled = false;
          btnEl.textContent = "로그인";
        }
      }

      function showForgotPanel() {
        resetBannerEl.style.display = "none";
        loginPanelEl.style.display = "none";
        forgotPanelEl.style.display = "block";
        forgotStatusEl.textContent = "";
      }

      function showLoginPanel() {
        forgotPanelEl.style.display = "none";
        loginPanelEl.style.display = "block";
        errEl.textContent = "";
      }

      async function sendResetEmail() {
        const email = emailEl.value.trim();
        if (!email) {
          forgotStatusEl.style.color = "#e05252";
          forgotStatusEl.textContent = "이메일을 입력하세요.";
          return;
        }
        sendResetBtnEl.disabled = true;
        sendResetBtnEl.textContent = "보내는 중...";
        const { error } = await authClient.auth.resetPasswordForEmail(email, { redirectTo: RESET_REDIRECT_URL });
        sendResetBtnEl.disabled = false;
        sendResetBtnEl.textContent = "재설정 메일 보내기";
        // 존재하지 않는 이메일이어도 동일한 안내만 보여준다(이메일 존재 여부 노출 방지).
        forgotStatusEl.style.color = error ? "#e05252" : "#d4af37";
        forgotStatusEl.textContent = error
          ? "메일 발송에 실패했습니다. 잠시 후 다시 시도하세요."
          : "입력하신 이메일로 재설정 링크를 보냈습니다. 메일함을 확인해주세요.";
      }

      btnEl.addEventListener("click", tryLogin);
      [emailEl, pwEl].forEach(function (el) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") tryLogin();
        });
      });
      forgotLinkEl.addEventListener("click", showForgotPanel);
      backToLoginEl.addEventListener("click", showLoginPanel);
      sendResetBtnEl.addEventListener("click", sendResetEmail);

      // 기존 하이탑 세션이 있어도 부동산을 선택할 수 있도록 로그인 화면을 유지한다.
      if (OfficeConfig.id === "ktop") emailEl.value = "ktop2027@gmail.com";
      emailEl.focus();
    })();
  </script>
</body>
</html>
