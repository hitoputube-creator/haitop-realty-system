<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 로그인 - 하이탑부동산</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="assets/js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:#0d0d0d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:-apple-system,'Malgun Gothic',sans-serif;">
  <div style="width:100%;max-width:320px;">
    <div style="text-align:center;margin-bottom:36px;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#d4af37,#f0c040);border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;">🏢</div>
      <div style="font-size:1.4rem;font-weight:800;color:#d4af37;letter-spacing:0.5px;">HITOP 부동산</div>
      <div style="font-size:0.8rem;color:#666;margin-top:4px;">관리자 로그인</div>
    </div>
    <input id="loginEmail" type="email" placeholder="이메일" autocomplete="username"
      style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#e0e0e0;outline:none;margin-bottom:10px;" />
    <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password"
      style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#e0e0e0;outline:none;margin-bottom:10px;" />
    <div id="loginError" style="font-size:0.82rem;color:#e05252;text-align:center;min-height:20px;margin-bottom:10px;"></div>
    <button id="loginBtn" style="width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">로그인</button>
  </div>

  <script>
    (function () {
      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const emailEl = document.getElementById("loginEmail");
      const pwEl = document.getElementById("loginPassword");
      const errEl = document.getElementById("loginError");
      const btnEl = document.getElementById("loginBtn");

      // redirect 파라미터는 같은 사이트 안의 파일명(+쿼리)만 허용한다 (오픈 리다이렉트 방지).
      function getRedirectTarget() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("redirect") || "";
        if (!raw || raw.indexOf("login.html") === 0 || /^https?:\/\//i.test(raw) || raw.indexOf("//") === 0) {
          return "index.html";
        }
        return raw;
      }

      async function tryLogin() {
        errEl.textContent = "";
        const email = emailEl.value.trim();
        const password = pwEl.value;
        if (!email || !password) {
          errEl.textContent = "이메일과 비밀번호를 입력하세요.";
          return;
        }
        btnEl.disabled = true;
        btnEl.textContent = "로그인 중...";
        const { error } = await authClient.auth.signInWithPassword({ email, password });
        btnEl.disabled = false;
        btnEl.textContent = "로그인";
        if (error) {
          errEl.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인하세요.";
          pwEl.value = "";
          pwEl.focus();
          return;
        }
        location.replace(getRedirectTarget());
      }

      btnEl.addEventListener("click", tryLogin);
      [emailEl, pwEl].forEach(function (el) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") tryLogin();
        });
      });

      // 이미 유효한 세션이 있으면 로그인 화면을 보여주지 않고 바로 이동한다.
      authClient.auth.getSession().then(function (res) {
        if (res.data.session) location.replace(getRedirectTarget());
      });

      emailEl.focus();
    })();
  </script>
</body>
</html>
