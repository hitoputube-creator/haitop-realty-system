<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>고객명단 가져오기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261007-kind" />
  <script src="assets/js/storage.js?v=20261007-backup"></script>
  <script src="assets/js/office-brand.js?v=20261006-brand-layout"></script>
  <script src="assets/js/admin-guard.js?v=20261006-office-login"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/auth.js?v=20261006-office-login"></script>
  <script src="assets/js/nav.js?v=20261007-ktop-internal"></script>
  <style>
    .imp-box { margin:14px 0; padding:14px 16px; border:1px solid rgba(212,175,55,0.3); border-radius:10px; }
    .imp-box h2 { margin:0 0 8px; font-size:1.02rem; }
    .imp-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .imp-log { white-space:pre-wrap; font-size:0.82rem; color:var(--text-muted); margin-top:10px; }
    .imp-table-wrap { max-height:340px; overflow:auto; margin-top:8px; }
    .imp-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
    .imp-table th, .imp-table td { padding:5px 8px; border-bottom:1px solid rgba(255,255,255,0.07); text-align:left; white-space:nowrap; }
    .imp-table td.memo { white-space:normal; min-width:260px; }
  </style>
</head>
<body data-nav-active="customers">
<div class="page">
  <header class="header">
    <div class="logo-icon"></div>
    <div class="logo-text"><div class="logo-main">고객명단 가져오기</div><div class="logo-sub">일회용</div></div>
    <nav class="main-nav" id="mainNav"></nav>
  </header>
  <div class="header-line"></div>

  <section class="imp-box">
    <h2>지금 접속한 사무실: <span id="officeName">-</span></h2>
    <div>아래 <b id="rowCount">0</b>건을 고객관리에 <b>상태 "신규"</b>로 넣습니다. 이미 같은 연락처의 고객이 있으면 건너뛰고, 이미 넣은 줄은 다시 넣어도 중복되지 않습니다.</div>
  </section>

  <section class="imp-box">
    <h2>① 먼저 현재 고객 전체 백업</h2>
    <div>백업 파일을 받아야 ② 입력 버튼이 켜집니다.</div>
    <div class="imp-actions"><button class="btn btn-ghost" id="backupBtn">📥 현재 고객 백업 받기 (JSON)</button></div>
  </section>

  <section class="imp-box">
    <h2>② 고객 입력</h2>
    <div class="imp-actions"><button class="btn btn-primary" id="importBtn" disabled>고객 입력하기</button></div>
    <div class="imp-log" id="log"></div>
  </section>

  <section class="imp-box">
    <h2>입력될 내용 미리보기</h2>
    <div class="imp-table-wrap"><table class="imp-table"><thead><tr><th>#</th><th>이름</th><th>연락처</th><th>구분</th><th>유형</th><th>접수일</th><th>메모</th></tr></thead><tbody id="previewBody"></tbody></table></div>
  </section>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const log = m => { $("log").textContent += m + "\n"; };
  let rows = [], backedUp = false;

  async function init() {
    $("officeName").textContent = (OfficeConfig && OfficeConfig.label) || "-";
    const res = await fetch("data/customers-import-b4.json?v=1");
    if (!res.ok) throw new Error("가져올 파일을 찾을 수 없습니다");
    rows = (await res.json()).rows;
    $("rowCount").textContent = rows.length;
    $("previewBody").innerHTML = rows.map((r, i) =>
      `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.role)}</td><td>${esc(r.category)}</td><td>${esc(r.date)}</td><td class="memo">${esc(r.memo)}</td></tr>`).join("");
  }

  $("backupBtn").addEventListener("click", async () => {
    $("backupBtn").disabled = true;
    try {
      const all = await getCustomers();
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), office: OfficeConfig.id, table: "customers", count: all.length, rows: all }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${OfficeConfig.label}_고객입력전백업_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      backedUp = true;
      log(`✅ 백업 완료: 현재 고객 ${all.length}건`);
      $("importBtn").disabled = false;
    } catch (e) { log("❌ 백업 실패: " + e.message); }
    $("backupBtn").disabled = false;
  });

  $("importBtn").addEventListener("click", async () => {
    if (!backedUp) return;
    if (!confirm(`${OfficeConfig.label} 고객관리에 ${rows.length}건을 입력합니다. 계속할까요?`)) return;
    $("importBtn").disabled = true;
    let ok = 0, dupPhone = 0, dupCode = 0, failed = 0;
    try {
      const existing = await getCustomers();
      const phones = new Set(existing.map(c => c.phone_normalized).filter(Boolean));
      for (const r of rows) {
        const p = r.payload;
        if (p.phone_normalized && phones.has(p.phone_normalized)) { dupPhone++; continue; }
        try { await addCustomer(p); ok++; if (p.phone_normalized) phones.add(p.phone_normalized); }
        catch (e) {
          if (/duplicate|23505|already exists|409/i.test(e.message)) dupCode++;
          else { failed++; log(`❌ ${r.id} (${r.name || r.phone}): ${e.message}`); }
        }
      }
      log(`입력 완료 — 새로 ${ok}건, 같은 연락처 고객이 이미 있어 건너뜀 ${dupPhone}건, 이미 넣은 줄 ${dupCode}건, 실패 ${failed}건`);
      const all = await getCustomers();
      log(`확인: 지금 DB에 들어 있는 이 명단 ${all.filter(x => String(x.customer_code).startsWith("C-IMP-")).length}건 / 전체 고객 ${all.length}건`);
    } catch (e) { log("❌ 오류: " + e.message); }
    $("importBtn").disabled = false;
  });

  init().catch(e => log("❌ 준비 실패: " + e.message));
})();
</script>
</body>
</html>
