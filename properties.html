  <style>
    .property-main-return { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }

    /* 목록보기 테이블: 세부 스타일은 assets/css/style.css?v=20261006-brand-layout에서 관리 */
    /* 선택매물보기 테이블 */
    #selectedViewTableWrap { overflow-x: auto; }
    #selectedViewTable { width:100%; border-collapse:collapse; font-size:0.83rem; }
    #selectedViewTable thead th { padding:9px 10px; text-align:left; font-weight:600; color:var(--text-muted); border-bottom:2px solid rgba(212,175,55,0.25); }
    #selectedViewTable tbody td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.06); vertical-align:top; }
    #selectedViewTable tbody tr:hover td { background:rgba(212,175,55,0.05); }
    #selectedViewTable tbody tr.done-row td { color:#666; }
    /* 선택매물 인쇄 전용: 화면 배치는 유지하고 A4 가로 표로 출력 */
    @page { size: A4 landscape; margin: 10mm; }
    @media print {
      html, body { width: auto !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
      body * { visibility: hidden; }
      #selectedPrintArea, #selectedPrintArea * { visibility: visible; }
      #selectedPreviewSection { display: block !important; margin: 0 !important; padding: 0 !important; border: 0 !important; background: transparent !important; box-shadow: none !important; }
      #selectedPrintArea {
        position: absolute !important; top: 0; left: 0;
        width: 100% !important; margin: 0 !important; padding: 0 !important;
        box-sizing: border-box; background: #fff !important;
      }
      #selectedPrintHeader { display: flex !important; margin-bottom: 9px !important; }
      #selectedViewTableWrap { width: 100% !important; overflow: visible !important; }
      #selectedViewTable {
        width: 100% !important; table-layout: fixed !important;
        border-collapse: collapse !important; font-size: 9pt !important;
        line-height: 1.4 !important; color: #111 !important;
      }
      #selectedViewTable th, #selectedViewTable td {
        box-sizing: border-box !important; min-width: 0 !important;
        white-space: normal !important; word-break: keep-all !important;
        overflow-wrap: anywhere !important;
      }
      #selectedViewTable th:first-child, #selectedViewTable td:first-child { display: none !important; }
      #selectedViewTable th:nth-child(2), #selectedViewTable td:nth-child(2) { width: 4% !important; text-align: center !important; }
      #selectedViewTable th:nth-child(3), #selectedViewTable td:nth-child(3) { width: 9% !important; }
      #selectedViewTable th:nth-child(4), #selectedViewTable td:nth-child(4) { width: 29% !important; }
      #selectedViewTable th:nth-child(5), #selectedViewTable td:nth-child(5) { width: 14% !important; }
      #selectedViewTable th:nth-child(6), #selectedViewTable td:nth-child(6) { width: 8% !important; }
      #selectedViewTable th:nth-child(7), #selectedViewTable td:nth-child(7) { width: 13% !important; }
      #selectedViewTable th:nth-child(8), #selectedViewTable td:nth-child(8) { width: 6% !important; }
      #selectedViewTable th:nth-child(9), #selectedViewTable td:nth-child(9) { width: 17% !important; }
      #selectedViewTable thead th {
        background: #1a2a4a !important; color: #fff !important;
        padding: 7px 5px !important; border: 1px solid #d6dce6 !important;
        font-weight: 700 !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      #selectedViewTable tbody td {
        padding: 7px 5px !important; border: 1px solid #d6dce6 !important;
        color: #111 !important; vertical-align: top !important;
      }
      #selectedViewTable tbody td * { color: #111 !important; background: transparent !important; }
      #selectedViewTable .selected-print-unit { display: block !important; margin-top: 2px; font-weight: 700 !important; }
      #selectedViewTable tbody tr.done-row td { color: #666 !important; background: #f5f5f5 !important; }
      #selectedViewTable tr { break-inside: avoid !important; page-break-inside: avoid !important; }
      #selectedViewTable thead { display: table-header-group !important; }
      #selectedViewTable tbody { display: table-row-group !important; }
    }
    @media screen {
      #printHeader { display: none; }
      #selectedPrintHeader { display: none; }
    }
    /* 카드 더보기/접기 공통 */
    .card-expand-wrap { position:relative; max-height:100px; overflow:hidden; transition:max-height 0.3s ease; }
    .card-expand-fade { position:absolute; bottom:0; left:0; right:0; height:36px; background:linear-gradient(transparent,var(--bg-card)); pointer-events:none; }
    .card-expand-btn { display:none; width:100%; background:none; border:none; border-top:1px solid rgba(212,175,55,0.15); color:var(--gold); font-size:0.78rem; cursor:pointer; padding:6px 0 2px; margin-bottom:6px; font-family:inherit; letter-spacing:0.03em; }
    /* ══════════════════════════════════════════
       2단계: 검색·정렬·필터 영역 정리
       (상단 내비게이션 CSS는 assets/css/style.css?v=20261006-brand-layout로 공통화됨)
    ══════════════════════════════════════════ */

    /* ── 검색·정렬·필터 통합 카드 ── */
    .filter-panel-card { padding: 14px 16px; }
    .toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-row .search-field { flex: 1 1 200px; margin-bottom: 0; }
    .toolbar-row input, .toolbar-row select { height: 36px; padding: 0 12px; }
    .toolbar-row #searchBtn { height: 36px; padding: 0 18px; }
    .include-done-label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .sort-select { width: auto; min-width: 100px; flex: 0 0 auto; }
    .view-toggle-group { display: flex; border: 1px solid var(--border-slate); border-radius: 8px; overflow: hidden; flex-shrink: 0; height: 36px; }
    .view-toggle-group button { height: 100%; padding: 0 16px; font-size: 0.78rem; font-weight: 600; background: transparent; color: var(--text-muted); border: none; cursor: pointer; font-family: inherit; }
    .view-toggle-group button + button { border-left: 1px solid var(--border-slate); }
    .filter-divider { border-top: 1px solid var(--border-slate); margin: 12px 0; }
    .filter-panel-title { font-size: 0.85rem; color: var(--gold-soft); margin-bottom: 8px; }

    /* 모바일: 상세등록 버튼 / 검색창을 각각 한 줄씩 쌓는다 */
    @media (max-width: 480px) {
      .toolbar-row { flex-direction: column; align-items: stretch; }
      .toolbar-row #detailRegisterBtn { width: 100%; }
      .toolbar-row #searchBtn { width: 100%; }
      .toolbar-row .field { width: 100%; }
      .toolbar-row .include-done-label { width: 100%; }
      .toolbar-row .sort-select { width: 100%; }
      .view-toggle-group { width: 100%; }
      .view-toggle-group button { flex: 1; }
    }

    /* 유형별 필터 박스 — 매물유형 버튼(왼쪽) + 단지 필터 드롭다운(오른쪽) */
    .filter-panel-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .filter-panel-row .filter-row { flex: 1 1 auto; }
    .complex-filter-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .complex-filter-wrap select { width: auto; min-width: 150px; max-width: 320px; padding: 5px 8px; font-size: 0.8rem; text-overflow: ellipsis; }
    /* 거래유형 필터 — 유형별 필터 오른쪽에 별도로 노출 (주거용 선택 시 전세·월세로 교체) */
    .deal-filter-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .deal-filter-wrap .filter-row { flex-wrap: nowrap; }
    /* 모바일에서는 같은 박스 내부 하단에 전체 폭으로 배치 */
    @media (max-width: 480px) {
      .complex-filter-wrap { width: 100%; margin-top: 8px; }
      .complex-filter-wrap select { flex: 1; min-width: 0; }
      .deal-filter-wrap { width: 100%; margin-top: 8px; }
      .deal-filter-wrap .filter-row { flex-wrap: wrap; }
    }
  .apartment-deal-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px}.apartment-deal-summary[hidden]{display:none}.apartment-deal-total{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:12px;border:1px solid currentColor;background:rgba(255,255,255,.03);cursor:pointer;font:inherit}.apartment-deal-total strong{font-size:1.55rem}.apartment-deal-total span{font-size:.8rem}.apartment-deal-0{color:#e5bf46}.apartment-deal-1{color:#8fbff3}.apartment-deal-2{color:#48d68b}.apartment-deal-3{color:#baa6ff}.apartment-deal-total.active{background:rgba(212,175,55,.18);box-shadow:inset 0 0 0 2px currentColor}

/* 매물관리 상단 도구 정리 */
.properties-page .property-main-return { margin:12px 0; gap:8px; }
.properties-page .property-main-return .btn { width:auto; padding:7px 12px; border-radius:8px; font-size:.8rem; color:var(--text-muted); border-color:var(--border-slate); background:transparent; }
.properties-page .listing-top-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
.properties-page .kind-tab-row { display:flex; gap:0; margin:0; border:1px solid var(--border-slate); border-radius:8px; overflow:hidden; }
.properties-page .kind-tab { margin:0; border:0; border-radius:0; background:transparent; padding:8px 16px; color:var(--text-muted); }
.properties-page .kind-tab + .kind-tab { border-left:1px solid var(--border-slate); }
.properties-page .kind-tab.active { background:#263b50; color:#ffe29a; }
.properties-page #detailRegisterBtn { padding:9px 16px; border-radius:8px; }
.properties-page .toolbar-row { display:grid; grid-template-columns:minmax(180px,1fr) 64px 108px 108px 112px; gap:8px; align-items:center; }
.properties-page .toolbar-row .search-field { width:100%; margin:0; }
.properties-page .toolbar-row #searchBtn, .properties-page .toolbar-row .sort-select { width:100%; border-radius:8px; }
.properties-page .toolbar-row input { border-radius:8px; }
.properties-page .view-toggle-group { width:100%; }
.properties-page .view-toggle-group button { flex:1; padding:0 10px; }
.properties-page .filter-panel-row { display:grid; grid-template-columns:68px minmax(0,1fr) auto; gap:10px; align-items:center; }
.properties-page .filter-group-label { color:var(--text-muted); font-size:.78rem; white-space:nowrap; }
.properties-page #filterRow, .properties-page #dealFilterRow, .properties-page #subFilterRow { gap:6px; margin:0; }
.properties-page .filter-panel-card .filter-btn { border:1px solid transparent; border-radius:6px; padding:6px 11px; background:rgba(255,255,255,.04); color:var(--text-muted); }
.properties-page .filter-panel-card .filter-btn.active { background:#263b50; border-color:#8f793e; color:#ffe29a; }
.properties-page .complex-filter-wrap { margin:0; }
.properties-page .complex-filter-wrap select { height:32px; border-radius:6px; min-width:160px; max-width:260px; }
.properties-page .deal-filter-wrap { grid-column:1/-1; display:grid; grid-template-columns:68px minmax(0,1fr); margin:0; gap:10px; }
.properties-page #subFilterRow { padding-left:78px; }
@media(max-width:800px) {
 .properties-page .filter-panel-row { grid-template-columns:68px minmax(0,1fr); }
 .properties-page .complex-filter-wrap { grid-column:1/-1; display:grid; grid-template-columns:68px minmax(0,1fr); gap:10px; width:100%; }
 .properties-page .complex-filter-wrap select { width:100%; max-width:none; }
}
@media(max-width:600px) {
 .properties-page .listing-top-row { flex-wrap:wrap; }
 .properties-page .kind-tab { padding:8px 12px; }
 .properties-page .toolbar-row { grid-template-columns:repeat(3,minmax(0,1fr)); }
 .properties-page .toolbar-row .search-field { grid-column:1/3; }
 .properties-page .toolbar-row #searchBtn { grid-column:3; }
 .properties-page .filter-panel-row { grid-template-columns:1fr; }
 .properties-page .complex-filter-wrap, .properties-page .deal-filter-wrap { grid-column:1; grid-template-columns:68px minmax(0,1fr); }
 .properties-page #subFilterRow { padding-left:0; }
}
</style>

<script>

<body class="properties-page" data-nav-active="properties">

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-icon"></div>
    <div class="logo-text">
      <div class="gps-heading-row"><div class="logo-main">HITOP 부동산 매물관리</div><div id="globalPropertySearchToolbar" class="gps-toolbar no-print"></div></div>

    <a class="btn btn-ghost" id="propertyKakaoMap" href="residential-kakao.html">카카오맵</a>

  <div id="globalPropertySearch" class="no-print"></div>
  <script>
    (function () {
      const keys = ['all', 'shop', 'land', 'home', 'factory', 'other'];
      let category = new URLSearchParams(location.search).get('mainCategory');
      if (!keys.includes(category)) {
        try {
          const state = JSON.parse(OfficeStorage.session.getItem('hitop_properties_filter_state') || '{}') || {};
          const majorToCategory = {'':'all', '상가사무실':'shop', '토지':'land', '주거용':'home', '공장창고':'factory', '건물빌딩':'other'};
          category = majorToCategory[state.currentMajor];
        } catch (_) {}
      }
      if (!keys.includes(category)) category = 'all';
      document.getElementById('propertyMainReturn').href = 'property-main.html?category=' + category;
      document.getElementById('propertyKakaoMap').href = OfficeConfig.urlFor('residential-kakao.html');
      document.getElementById('propertyCustomers').href = OfficeConfig.urlFor('customers.html');
    })();
  </script>

  <!-- ===== 매물관리 ===== -->
  <div id="tabProperty">

    <!-- ===== 검색·정렬·필터 통합 영역 ===== -->

        <button type="button" class="kind-tab" data-kind="명단">명단<span class="kind-count" id="kindCountRoster"></span></button>

      </div>

        <div class="field search-field">

        <button class="btn btn-ghost" id="searchBtn" style="flex:0 0 auto;white-space:nowrap;">검색</button>
        <input type="checkbox" id="includeCompletedChk" hidden /><select id="listingStatusFilter" class="sort-select" title="진행중·보류·거래완료로 필터링" aria-label="매물 거래상태 필터"><option value="진행중">진행중</option><option value="보류">보류</option><option value="거래완료">거래완료</option><option value="전체">전체 상태</option></select>

<div id="appErrorOverlay" style="display:none;position:fixed;inset:0;z-index:99999;background:#0d0d0d;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
  <div style="font-size:2.5rem;margin-bottom:16px;">⚠️</div>
  <div style="font-size:1.1rem;font-weight:700;color:#e0e0e0;margin-bottom:8px;">연결 오류가 발생했습니다</div>
  <div id="appErrorMsg" style="font-size:0.85rem;color:#888;margin-bottom:24px;max-width:320px;line-height:1.6;">새로고침 해주세요.</div>
  <button onclick="location.reload()" style="background:#d4af37;color:#000;border:none;border-radius:8px;padding:12px 28px;font-size:0.95rem;font-weight:700;cursor:pointer;">🔄 새로고침</button>
</div>

<script>
  function showAppError(msg) {
    const el = document.getElementById("appErrorOverlay");
    if (!el) return;
    document.getElementById("appErrorMsg").textContent = msg || "새로고침 해주세요.";
    el.style.display = "flex";
  }
  window.onerror = function(msg, src, line, col, err) {
    showAppError((err && err.message) || msg || "알 수 없는 오류가 발생했습니다.");
  };
  window.onunhandledrejection = function(e) {
    const msg = (e.reason && e.reason.message) || String(e.reason) || "비동기 오류가 발생했습니다.";
    if (msg.includes("저장 실패") || msg.includes("수정 실패") || msg.includes("삭제 실패")) return;
    showAppError(msg);
  };

  function showToast(msg, duration = 2000) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), duration);
  }
</script>
