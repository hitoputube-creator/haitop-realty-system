<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>하이탑부동산 | 건물별 층 현황</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <style>
    body { margin:0; background:#081727; color:#f8f3e6; }
    main { max-width:1380px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:22px; }
    h1 { margin:0; font-size:1.5rem; } p { color:#b9c5d8; }
    header p { margin:5px 0 0; }
    .nav { display:flex; gap:9px; flex-wrap:wrap; }
    .nav a, .card a { color:#f8f3e6; border:1px solid #a17b19; border-radius:8px; padding:9px 14px; text-decoration:none; }
    .nav a:hover, .card:hover { border-color:#e2bd42; background:#1b3452; }
    .floor-picker { display:flex; align-items:center; gap:8px; margin:0 0 14px; }
    .floor-picker select { padding:8px 12px; border:1px solid #536989; border-radius:7px; background:#122844; color:#fff; font:inherit; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .card { background:#10213b; border:1px solid #36516e; border-radius:12px; overflow:hidden; transition:background .15s,border-color .15s; }
    .card > a { display:block; padding:0; border:0; border-radius:0; height:100%; }
    .card img { width:100%; height:180px; object-fit:contain; background:#e9edf1; display:block; }
    .card .body { padding:14px; }
    .card h2 { color:#e2bd42; font-size:1.05rem; margin:0 0 6px; }
    .card p { margin:0; font-size:.82rem; overflow-wrap:anywhere; }
    #message { min-height:1.5em; }
  </style>
<link rel="stylesheet" href="assets/css/white-navy-workspace.css?v=20261008-v1">
