<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>명단 가져오기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261007-kind" />
  <script src="assets/js/storage.js?v=20261007-backup"></script>
  <script src="assets/js/office-brand.js?v=20261006-brand-layout"></script>
  <script src="assets/js/admin-guard.js?v=20261006-office-login"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/auth.js?v=20261006-office-login"></script>
  <script src="assets/js/nav.js?v=20261007-ktop-internal"></script>
  <style>
    .imp-box { margin:14px 0; padding:14px 16px; border:1px solid rgba(212,175,55,0.3); border-radius:10px; }
    .imp-box h2 { margin:0 0 8px; font-size:1.02rem; }
    .imp-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .imp-log { white-space:pre-wrap; font-size:0.82rem; color:var(--text-muted); margin-top:10px; }
    .imp-table-wrap { max-height:340px; overflow:auto; margin-top:8px; }
    .imp-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
    .imp-table th, .imp-table td { padding:5px 8px; border-bottom:1px solid rgba(255,255,255,0.07); text-align:left; white-space:nowrap; }
    .imp-table td.memo { white-space:normal; min-width:220px; }
  </style>
</head>
<body data-nav-active="properties">
<div class="page">
  <header class="header">
    <div class="logo-icon"></div>
    <div class="logo-text"><div class="logo-main">명단 가져오기</div><div class="logo-sub">일회용</div></div>
    <nav class="main-nav" id="mainNav"></nav>
  </header>
  <div class="header-line"></div>

  <section class="imp-box">
    <h2>지금 접속한 사무실: <span id="officeName">-</span></h2>
    <div>아래 <b id="rowCount">0</b>건을 <b>등록구분 "명단"</b>으로 매물관리에 넣습니다. 홈페이지 공개는 꺼진 상태로 들어가고, 이미 넣은 줄은 다시 넣어도 중복되지 않습니다.</div>
  </section>

  <section class="imp-box">
    <h2>① 먼저 현재 매물 전체 백업</h2>
    <div>백업 파일을 받아야 ② 입력 버튼이 켜집니다.</div>
    <div class="imp-actions"><button class="btn btn-ghost" id="backupBtn">📥 현재 매물 백업 받기 (JSON)</button></div>
  </section>

  <section class="imp-box">
    <h2>② 명단 입력</h2>
    <div class="imp-actions"><button class="btn btn-primary" id="importBtn" disabled>명단 입력하기</button></div>
    <div class="imp-log" id="log"></div>
  </section>

  <section class="imp-box">
    <h2>입력될 내용 미리보기</h2>
    <div class="imp-table-wrap"><table class="imp-table"><thead><tr><th>#</th><th>단지</th><th>동</th><th>호</th><th>소유주</th><th>연락처</th><th>구분</th><th>가격</th><th>메모</th></tr></thead><tbody id="previewBody"></tbody></table></div>
  </section>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const log = m => { $("log").textContent += m + "\n"; };
  let rows = [];
  let backedUp = false;
  let idPrefix = "ROSTER-";

  const won = n => (n === null || n === undefined || n === "") ? "" : String(n);
  const manwon = n => (n === null || n === undefined || n === "") ? null : Number(n) / 10000;

  function buildItem(r) {
    const floor = /^\d+$/.test(r.ho) ? Math.floor(Number(r.ho) / 100) : null;
    const unit = {
      아파트명: r.complex, 동: r.dong, 호: r.ho, 호수: r.unit, 층: floor, 접수일자: r.receivedDate || null,
      권리구분: "일반 아파트", 타입: r.type || null,
      거래구분: r.dealType || null, 현_매매가격: manwon(r.salePrice), 현_보증금: manwon(r.deposit), 현_월세: manwon(r.monthlyRent),
      소유주: r.owner || null, 연락처: r.phone1 || null, 소유자통신사: r.carrier || null,
      세입자현황: r.tenantStatus || "", 공실여부: r.tenantStatus || "",
      비고: r.memo || null, 추가메모: [], updated_at: new Date().toISOString()
    };
    return {
      id: r.id, type: "apartment", category1: "주거용", category2: "아파트",
      title: r.complex + (r.unit ? " · " + r.unit : ""),
      address: r.address, publicAddress: r.address, mapAddress: r.address,
      complexName: r.complex, buildingName: r.complex, dong: r.dong, ho: r.ho, privateDetailAddress: r.unit,
      status: "광고중", listingKind: r.kind, listingNo: r.id.replace(/^ROSTER-/, ""), description: r.memo || "",
      is_public: false, resource_id: r.resource_id, image_urls: [], imageUrls: [], allImageUrls: [], publicImageUrls: [],
      dealType: r.dealType || "", salePrice: won(r.salePrice), deposit: won(r.deposit), monthlyRent: won(r.monthlyRent),
      apartmentType: r.type || "", received_date: r.receivedDate || "",
      owner_name: r.owner || "", owner_phone1: r.phone1 || "", owner_phone2: r.phone2 || "", ownerCarrier: r.carrier || "",
      floorInfo: floor == null ? "" : floor + "층",
      apartmentUnitData: unit, imported_from: "엑셀 명단 · " + r.source
    };
  }

  function priceText(r) {
    if (r.salePrice) return "매매 " + (r.salePrice / 10000).toLocaleString() + "만";
    if (r.monthlyRent) return (r.deposit / 10000).toLocaleString() + "/" + (r.monthlyRent / 10000).toLocaleString() + "만";
    if (r.deposit) return "보증금 " + (r.deposit / 10000).toLocaleString() + "만";
    return "";
  }

  async function init() {
    $("officeName").textContent = (OfficeConfig && OfficeConfig.label) || "-";
    const file = new URLSearchParams(location.search).get("file") || "roster-import-c11";
    if (!/^[a-z0-9-]+$/.test(file)) throw new Error("잘못된 파일 이름");
    const res = await fetch("data/" + file + ".json?v=1");
    if (!res.ok) throw new Error("가져올 파일을 찾을 수 없습니다: " + file);
    const json = await res.json();
    rows = json.rows;
    idPrefix = rows[0].id.replace(/\d+$/, "");
    $("rowCount").textContent = rows.length;
    $("previewBody").innerHTML = rows.map((r, i) =>
      `<tr><td>${i + 1}</td><td>${r.complex}</td><td>${r.dong}</td><td>${r.ho}</td><td>${r.owner}</td><td>${r.phone1}</td><td>${r.dealType}</td><td>${priceText(r)}</td><td class="memo">${(r.memo || "").replace(/</g, "&lt;")}</td></tr>`).join("");
  }

  $("backupBtn").addEventListener("click", async () => {
    $("backupBtn").disabled = true;
    try {
      const all = await getListingsRaw();
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), office: OfficeConfig.id, table: "listings", count: all.length, rows: all }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${OfficeConfig.label}_입력전백업_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      backedUp = true;
      log(`✅ 백업 완료: 현재 매물 ${all.length}건`);
      $("importBtn").disabled = false;
    } catch (e) { log("❌ 백업 실패: " + e.message); }
    $("backupBtn").disabled = false;
  });

  $("importBtn").addEventListener("click", async () => {
    if (!backedUp) return;
    if (!confirm(`${OfficeConfig.label}에 명단 ${rows.length}건을 입력합니다. 계속할까요?`)) return;
    $("importBtn").disabled = true;
    let ok = 0, skipped = 0, failed = 0;
    for (const r of rows) {
      try { await addListing(buildItem(r)); ok++; }
      catch (e) {
        if (/duplicate|23505|already exists|409/i.test(e.message)) skipped++;
        else { failed++; log(`❌ ${r.id} (${r.unit || r.phone1}): ${e.message}`); }
      }
    }
    log(`입력 완료 — 새로 ${ok}건, 이미 있어서 건너뜀 ${skipped}건, 실패 ${failed}건`);
    try {
      const all = await getListingsRaw();
      const n = all.filter(x => String(x.id).startsWith(idPrefix)).length;
      log(`확인: 지금 DB에 들어 있는 이 명단 ${n}건 / 전체 매물 ${all.length}건`);
    } catch (e) { log("확인 조회 실패: " + e.message); }
    $("importBtn").disabled = false;
  });

  init().catch(e => log("❌ 준비 실패: " + e.message));
})();
</script>
</body>
</html>
