  <body>
    <div id="root"></div>
      <script>
      (function () {
        var HOME = 'https://hitoputube-creator.github.io/hitop-ai-workcenter/login.html?redirect=';
        function addHomeLink() {
          var box = document.querySelector('.auth-overlay .auth-brand');
          if (!box || !box.querySelector('a.auth-logout-btn') || box.querySelector('.auth-home-link')) return;
          var a = document.createElement('a');
          a.className = 'auth-home-link';
          a.href = HOME;
          a.textContent = '공통 홈 로그인 페이지 (하이탑 · 케이탑 선택)';
          box.appendChild(a);
        }
        new MutationObserver(addHomeLink).observe(document.documentElement, { childList: true, subtree: true });
        addHomeLink();
      })();
    </script>
  </body>
