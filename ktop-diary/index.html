<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 케이탑 6자리 간편로그인을 등록한 기기는, 이번 브라우저에서 확인(12시간 유효)하기 전에는 열지 않는다.
      (function () {
        try {
          var mark = document.cookie.match(/(?:^|; )ktopPinUnlocked=(\d+)/);
          var age = mark ? Date.now() - Number(mark[1]) : -1;
          if (localStorage.getItem('ktopPinDevice') && !(age >= 0 && age < 12 * 60 * 60 * 1000)) location.replace('../login.html?office=ktop');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/haitop-realty-system/ktop-diary/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>케이탑 업무일지</title>
    <script type="module" crossorigin src="/haitop-realty-system/ktop-diary/assets/index-q3rOlwXE-ac23.js?v=20261126-nc1"></script>
    <link rel="stylesheet" crossorigin href="/haitop-realty-system/ktop-diary/assets/index-LuE94APl.css">
    <link rel="stylesheet" href="./white-theme.css?v=20261117-hdr2" />
    <link rel="stylesheet" href="./white-theme-ac.css?v=20261126-nc1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" />
    <style>.wd-date-number { font-family: 'Poiret One', var(--font-sans); font-weight: 400; }</style>
  </head>
  <body>
    <div id="root"></div>
      <script>
      (function () {
        var HOME = 'https://hitoputube-creator.github.io/hitop-ai-workcenter/login.html?redirect=';
        function addHomeLink() {
          var box = document.querySelector('.auth-overlay .auth-brand');
          if (!box || !box.querySelector('a.auth-logout-btn') || box.querySelector('.auth-home-link')) return;
          var a = document.createElement('a');
          a.className = 'auth-home-link';
          a.href = HOME;
          a.textContent = '공통 홈 로그인 페이지 (하이탑 · 케이탑 선택)';
          box.appendChild(a);
        }
        new MutationObserver(addHomeLink).observe(document.documentElement, { childList: true, subtree: true });
        addHomeLink();
      })();
    </script>
  </body>
</html>
