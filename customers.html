    .cust-act-delete:hover { background:rgba(224,82,82,0.18); }

    @media(min-width:901px){.cust-table-head,.cust-row{grid-template-columns:1.15fr 1.2fr 1.35fr .9fr minmax(210px,1.35fr)}}
  .customer-contact-row{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:6px;margin-bottom:8px}.customer-contact-row input{min-width:0;width:100%;box-sizing:border-box}.customer-note-form textarea{min-height:150px;width:100%;box-sizing:border-box;resize:vertical}.customer-note-form{margin:12px 0 18px}.customer-note-form label{display:block;margin:8px 0}.customer-note-form input[type=date]{color-scheme:dark}.customer-note-error{color:var(--red)}@media(max-width:640px){.customer-contact-row{grid-template-columns:1fr 1fr}.customer-contact-row input[type=tel]{grid-column:1/2}}

<script>
  function showToast(msg, duration = 2000) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), duration);
  }
  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0");
  }
  // ===== 공통 페이지네이션 헬퍼 =====
  function _makePagination(elId, total, perPage, curPage, cb) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = "";
    const totalPages = Math.ceil(total / perPage);
    if (totalPages <= 1) return;
    const prev = document.createElement("button");
    prev.className = "page-btn" + (curPage === 1 ? " disabled" : "");
    prev.textContent = "‹ 이전";
    prev.onclick = () => { if (curPage > 1) cb(curPage - 1); };
    el.appendChild(prev);
    const info = document.createElement("span");
    info.className = "page-info";
    info.textContent = `${curPage} / ${totalPages}`;
    el.appendChild(info);
    const next = document.createElement("button");
    next.className = "page-btn" + (curPage === totalPages ? " disabled" : "");
    next.textContent = "다음 ›";
    next.onclick = () => { if (curPage < totalPages) cb(curPage + 1); };
    el.appendChild(next);
  }


  // ===== 고객관리 =====
  let allCustomers = [];
  let customerPage = 1;
  const CUST_PER_PAGE = 10;
  let customerSearch = "";
  let customerTypeFilter = '';
  const CUSTOMER_TYPES = ['매수자','임차인','소유자','부동산','업체','지인'];
  function customerKinds(c) {
    if(Array.isArray(c.customer_types) && c.customer_types.length)return c.customer_types;
    const mapping={매수:'매수자',임차:'임차인',매도:'소유자',임대:'소유자'};
    return mapping[c.customer_role] ? [mapping[c.customer_role]] : [];
  }
  function customerPhones(c) { return [...new Set([c.phone,...(c.contact_phones || []),...(c.additional_contacts || []).map(x=>x.phone)].filter(Boolean))]; }
  function selectedCustomerKinds(prefix) { return Array.from(document.querySelectorAll('#'+prefix+'_types input:checked')).map(el=>el.value); }
  function setCustomerKinds(prefix,values) { document.querySelectorAll('#'+prefix+'_types input').forEach(el=>el.checked=values.includes(el.value)); }
  function formPhones(prefix) { return [...new Set([document.getElementById(prefix+'_contact').value.trim(),...readCustomerContacts(prefix).map(v=>v.phone)].filter(Boolean))]; }
  for(const prefix of ['c','ce'])document.getElementById(prefix+'_types').innerHTML=CUSTOMER_TYPES.map(t=>'<label><input type="checkbox" value="'+t+'">'+t+'</label>').join('');
  function renderCustomerTypeTabs() {
    const base=allCustomers.filter(c=>c.status!=='계약완료');
    document.getElementById('customerTypeTabs').innerHTML=['전체',...CUSTOMER_TYPES,'미분류'].map(t=>{
      const key=t==='전체' ? '' : t;
      const count=base.filter(c=>!key || (key==='미분류' ? !customerKinds(c).length : customerKinds(c).includes(key))).length;
      return '<button type="button" data-customer-kind="'+key+'" aria-pressed="'+(customerTypeFilter===key)+'" class="'+(customerTypeFilter===key?'active':'')+'">'+t+' '+count+'</button>';
    }).join('');
  }
  document.getElementById('customerTypeTabs').addEventListener('click',e=>{
    const button=e.target.closest('[data-customer-kind]');
    if(!button)return;
    customerTypeFilter=button.dataset.customerKind;customerPage=1;renderCustomers();
  });

  // 레거시 매물유형 코드(shop/officetel/...)와 새 한글 값(상가/사무실 등)을 모두 그대로 보여준다.
  const LEGACY_TYPE_LABEL = { shop:"상가/사무실", officetel:"오피스텔", land:"토지", factory:"공장/창고", bizcenter:"지식산업센터" };
  function getCustomerTypeLabel(type) {
    if (!type) return "—";
    return LEGACY_TYPE_LABEL[type] || type;
  }

  let customerDiaryActivity = {}; // { customerId: {date, title, content} }

  function escapeHtmlCust(v) {
    return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function renderCustomers() {
    const container = document.getElementById("customerContainer");
    const empty = document.getElementById("customerEmpty");
    const badge = document.getElementById("customerCountBadge");
    container.innerHTML = "";

    renderCustomerTypeTabs();
    let filtered = allCustomers.filter(c => c.status !== "계약완료");
    if(customerTypeFilter)filtered=filtered.filter(c=>customerTypeFilter==="미분류" ? !customerKinds(c).length : customerKinds(c).includes(customerTypeFilter));
    if (customerSearch) {
      const kw = customerSearch.toLowerCase();
      filtered = filtered.filter(c =>
        [c.name, ...customerPhones(c), customerBasicMemo(c), c.memo, JSON.stringify(c.additional_contacts||[]), c.desired_price, c.desired_region, ...customerKinds(c), JSON.stringify(c.import_sources||[])].join(" ").toLowerCase().includes(kw) || (kw.replace(/\D/g,"").length>=4 && customerPhones(c).some(p=>normalizeCustomerPhone(p).includes(kw.replace(/\D/g,""))))
      );
    }

    badge.textContent = filtered.length ? `(${filtered.length}명)` : "";

    if (!filtered.length) {
      empty.style.display = "block";
      document.getElementById("customerPagination").innerHTML = "";
      return;
    }
    empty.style.display = "none";

    const custStart = (customerPage - 1) * CUST_PER_PAGE;
    const custPageItems = filtered.slice(custStart, custStart + CUST_PER_PAGE);
    custPageItems.forEach(c => {
      const row = document.createElement("div");
      row.className = "cust-row";
      const activity = customerDiaryActivity[c.id];
      const lastWork = activity ? (activity.title || (activity.content || "").slice(0, 24)) : "—";
      const lastDate = activity && activity.date ? formatDate(activity.date) : "—";

      row.innerHTML = `
        <span class="cust-cell cust-cell-name" data-label="고객명">${escapeHtmlCust(c.name) || "(이름 미입력)"}<small class="customer-tags">${escapeHtmlCust(customerKinds(c).join(" · ") || "미분류")}</small></span>
        <span class="cust-cell" data-label="연락처">${customerPhones(c).length ? customerPhones(c).map(p=>`<a class="cust-phone-link" href="tel:${escapeHtmlCust(p)}" onclick="event.stopPropagation()">${escapeHtmlCust(p)}</a>`).join("<br>") : "—"}</span>
        <span class="cust-cell" data-label="최근업무">${escapeHtmlCust(lastWork)}</span>
        <span class="cust-cell" data-label="최근상담일">${lastDate}</span>
        <span class="cust-cell cust-cell-actions" data-label="관리">
          <button class="btn cust-act-detail" onclick="event.stopPropagation();openCustomerDetail('${c.id}')">상세</button>
          <button class="btn cust-act-edit" onclick="event.stopPropagation();openCustomerEdit('${c.id}')">수정</button>
          <button class="btn cust-act-delete" onclick="event.stopPropagation();handleDeleteCustomer('${c.id}')">삭제</button>
          <button class="btn cust-act-diary" onclick="event.stopPropagation();openCustomerDiary('${c.id}')">일지</button>
        </span>
      `;
      container.appendChild(row);
    });
    _makePagination("customerPagination", filtered.length, CUST_PER_PAGE, customerPage, (p) => { customerPage = p; renderCustomers(); });
  }

  const DIARY_APP_URL = OFFICE_DIARY_URL;

  function openCustomerDiary(id) {
    window.open(DIARY_APP_URL + "?customerId=" + encodeURIComponent(id), "_blank", "noopener,noreferrer");
  }

  function customerBasicMemo(c) {
    if (c.basic_memo != null) return c.basic_memo;
    const memo = c.memo || '';
    return (c.import_sources || []).some(s=>s.source==='연락처정리.xlsx') ? memo.split('[연락처정리 원본 ')[0].trim() : memo;
  }
  function addCustomerContactRow(prefix, contact={}) {
    const row=document.createElement('div');row.className='customer-contact-row';
    row.innerHTML='<input data-contact-name aria-label="연락처 이름" placeholder="이름"><input data-contact-relation aria-label="관계" placeholder="관계 (배우자·회사)"><input data-contact-phone type="tel" aria-label="추가 전화번호" placeholder="전화번호"><button type="button" class="btn" aria-label="추가 연락처 삭제">삭제</button>';
    row.querySelector('[data-contact-name]').value=contact.name||'';
    row.querySelector('[data-contact-relation]').value=contact.relation||'';
    row.querySelector('[data-contact-phone]').value=contact.phone||'';
    row.querySelector('button').onclick=()=>row.remove();
    document.getElementById(prefix+'_contacts').appendChild(row);
  }
  function readCustomerContacts(prefix) {
    return [...document.getElementById(prefix+'_contacts').children].map(row=>({name:row.querySelector('[data-contact-name]').value.trim(),relation:row.querySelector('[data-contact-relation]').value.trim(),phone:row.querySelector('[data-contact-phone]').value.trim()})).filter(c=>c.name||c.relation||c.phone);
  }
  function setCustomerContacts(prefix,c) {
    document.getElementById(prefix+'_contacts').replaceChildren();
    const contacts=Array.isArray(c.additional_contacts)?c.additional_contacts:[];
    contacts.forEach(contact=>addCustomerContactRow(prefix,contact));
    const known=new Set(contacts.map(c=>normalizeCustomerPhone(c.phone)));
    customerPhones(c).filter(p=>normalizeCustomerPhone(p)!==normalizeCustomerPhone(c.phone)&&!known.has(normalizeCustomerPhone(p))).forEach(phone=>addCustomerContactRow(prefix,{phone}));
  }
  document.querySelectorAll('[data-add-contact]').forEach(btn=>btn.onclick=()=>addCustomerContactRow(btn.dataset.addContact));
  function customerToday() { return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date()); }
  function mountCustomerMemoForm(container,c,historyContainer) {
    container.innerHTML='<form class="customer-note-form"><div class="cust-detail-section-title">＋ 날짜별 추가메모</div><label>메모 날짜<input name="date" type="date" required></label><label>추가메모<textarea name="content" rows="5" placeholder="통화 내용이나 추가 참고사항" required></textarea></label><p class="customer-note-error" role="alert"></p><button class="btn btn-primary" type="submit">메모 저장</button></form>';
    const form=container.querySelector('form');form.elements.date.value=customerToday();let draft=null;
    form.onsubmit=async event=>{
      event.preventDefault();
      const date=form.elements.date.value,content=form.elements.content.value.trim();
      const error=form.querySelector('[role=alert]'),btn=form.querySelector('button');
      if(!date||!content){error.textContent='날짜와 메모 내용을 입력해 주세요.';return;}
      if(!draft||draft.date!==date||draft.content!==content)draft={id:crypto.randomUUID(),date,content};
      btn.disabled=true;error.textContent='';
      try {
        await addCustomerDiaryMemo(c,draft);
        if(container.isConnected&&container.querySelector('form')===form){form.elements.content.value='';draft=null;await renderCustomerHistory(historyContainer,c.id);}
        showToast('메모를 저장했습니다. 고객과 업무일지에 연결됐습니다.');
        loadCustomers();
      } catch(e){error.textContent=e.message;}
      finally {btn.disabled=false;}
    };
  }
  function customerImportDetails(c) {
    const sources=Array.isArray(c.import_sources)?c.import_sources:[];
    const props=[...new Map(sources.flatMap(r=>r.linked_properties||[]).map(p=>[JSON.stringify(p),p])).values()];
    const review=[...new Set(sources.flatMap(r=>r.review||[]))];
    const links=props.map(p=>p.listing_id ? '<a class="btn" href="'+escapeHtmlCust(OfficeConfig.urlFor('detail.html?id='+encodeURIComponent(p.listing_id)))+'">매물보기</a>' : p.building_id ? '<a class="btn" href="'+escapeHtmlCust(OfficeConfig.urlFor('building-detail.html?id='+encodeURIComponent(p.resource_id||p.building_id)+'#unitStatus'))+'">'+escapeHtmlCust([p.building_name,p.room].filter(Boolean).join(' · '))+'</a>' : '').join(' ');
    return (review.length ? '<p class="customer-import-summary">확인사항: '+escapeHtmlCust(review.join(' · '))+'</p>' : '')+(sources.length ? '<details><summary>연락처 원본 '+sources.length+'건</summary>'+sources.map(r=>'<div class="customer-import-summary">'+escapeHtmlCust(r.source+' '+r.source_row+'행\n'+Object.entries(r.original||{}).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>k+': '+v).join('\n'))+'</div>').join('<hr>')+(c.memo ? '<details style="margin-top:10px"><summary>이전 통합메모 원본</summary><div class="customer-import-summary">'+escapeHtmlCust(c.memo)+'</div></details>' : '')+'</details>' : '');
  }
  async function openCustomerDetail(id) {
    const c = allCustomers.find(x => x.id === id) || await getCustomerById(id);
    if (!c) { showToast("고객 정보를 찾을 수 없습니다"); return; }
    document.getElementById("custDetailTitle").textContent = `👤 ${c.name || "(이름 미입력)"}`;
    const body = document.getElementById("custDetailBody");
    body.innerHTML = `
      <div class="cust-detail-grid">
        <div><span>연락처</span><strong>${escapeHtmlCust(customerPhones(c).join(" / ")) || "—"}</strong></div>
        <div><span>고객 종류</span><strong>${escapeHtmlCust(customerKinds(c).join(" · ") || "미분류")}</strong></div>
        <div><span>찾는매물</span><strong>${escapeHtmlCust(getCustomerTypeLabel(c.property_category))}</strong></div>
        <div><span>예산</span><strong>${escapeHtmlCust(c.desired_price) || "—"}</strong></div>
        <div><span>관심지역</span><strong>${escapeHtmlCust(c.desired_region) || "—"}</strong></div>
        <div><span>상태</span><strong>${escapeHtmlCust(c.status) || "—"}</strong></div>
      </div>
      ${customerBasicMemo(c) ? `<div class="cust-detail-memo">📝 ${escapeHtmlCust(customerBasicMemo(c))}</div>` : ""}
      
      ${(c.additional_contacts || []).length ? '<div class="cust-detail-section-title">추가 연락처</div>'+c.additional_contacts.map(contact=>'<div>'+escapeHtmlCust([contact.name,contact.relation,contact.phone].filter(Boolean).join(' · '))+'</div>').join('') : ''}
      ${customerImportDetails(c)}<div id="custDetailNoteComposer"></div>
      <div class="cust-detail-section-title">연결된 전체 매물·세대·택지</div><div id="custRelatedProperties"></div>
      <div class="cust-detail-section-title">날짜별 메모 · 상담 기록</div>
      <div id="custDetailHistory" class="cust-history-list"><div class="loading" style="padding:14px;"><span class="spinner"></span>불러오는 중...</div></div>
    `;
    document.getElementById("customerDetailModal").style.display = "flex";
    mountCustomerMemoForm(document.getElementById('custDetailNoteComposer'),c,document.getElementById('custDetailHistory'));
    await Promise.all([renderCustomerHistory(document.getElementById('custDetailHistory'), id),renderCustomerProperties(document.getElementById('custRelatedProperties'),c)]);
  }

  async function renderCustomerProperties(container,c){
    const request=Symbol();container._propertyRequest=request;container.textContent='연결 매물을 불러오는 중...';
    try{
      const result=customerRelatedEntries(await getCustomerLinkContext(),c);
      if(container._propertyRequest!==request)return;
      container.innerHTML=(result.failed.length?'<p>'+escapeHtmlCust('일부 자료 조회 실패: '+result.failed.join(', '))+'</p>':'')+(result.properties.length?result.properties.map(p=>'<article class="cust-consultation"><strong>'+escapeHtmlCust(p.name)+'</strong><div>'+escapeHtmlCust(p.label+' · '+p.status)+'</div>'+p.links.map(link=>'<a class="btn" href="'+escapeHtmlCust(OfficeConfig.urlFor(link.href))+'">'+escapeHtmlCust(link.label)+'</a>').join(' ')+'</article>').join(''):'연결된 매물이 없습니다.');
    }catch(e){if(container._propertyRequest===request)container.textContent=e.message;}
  }
  async function renderCustomerHistory(container, customerId) {
    const request = Symbol();
    container._historyRequest = request;
    container.innerHTML = '<div class="loading">상담 기록을 불러오는 중...</div>';
    const current = () => container.isConnected && container._historyRequest === request;
    try {
      const history = await getCustomerDiaryHistory(customerId);
      if (!current()) return;
      container.replaceChildren();
      if (!history.length) {
        container.textContent = '연결된 상담 기록이 없습니다.';
        return;
      }
      const attachmentSlots = new Map();
      for (const entry of history) {
        const card = document.createElement('article');
        card.className = 'cust-consultation';
        card.innerHTML = `
          <div class="cust-consultation-meta">${escapeHtmlCust(formatDate(entry.date))} · ${escapeHtmlCust(entry.writer || '')}</div>
          <strong class="cust-consultation-title">${escapeHtmlCust(entry.title || '(제목 없음)')}</strong>${entry.listing_id ? '<a class="btn" href="'+escapeHtmlCust(OfficeConfig.urlFor('detail.html?id='+encodeURIComponent(entry.listing_id)))+'">해당 상담 매물보기</a>' : ''}
          <div class="cust-consultation-content">${escapeHtmlCust(entry.content || '(내용 없음)')}</div>
          <div class="cust-consultation-attachments"></div>
          <div class="cust-consultation-actions">
            <button type="button" class="btn consult-edit">메모·상담 수정</button>
            <a class="btn" href="${DIARY_APP_URL}?customerId=${encodeURIComponent(customerId)}" target="_blank" rel="noopener noreferrer">업무일지에서 보기 · 메모 추가</a>
          </div>`;
        attachmentSlots.set(entry.id, card.querySelector('.cust-consultation-attachments'));
        const editButton = card.querySelector('.consult-edit');
        editButton.onclick = () => {
          if (card.querySelector('form')) return;
          editButton.hidden = true;
          card.classList.add('is-editing');
          const form = document.createElement('form');
          form.className = 'cust-consultation-editor';
          form.innerHTML = `<label>기록 날짜<input name="date" type="date" required></label><label>상담 제목<input name="title" type="text"></label>
            <label>상담 내용<textarea name="content" rows="8" required></textarea></label>
            <p class="cust-history-help">저장하면 원본 업무일지에도 반영됩니다.</p>
            <p class="consult-error" role="alert"></p>
            <div class="cust-consultation-actions"><button type="submit" class="btn btn-primary">상담 저장</button><button type="button" class="btn consult-cancel">취소</button></div>`;
          form.elements.date.value = entry.date || customerToday();
          form.elements.title.value = entry.title || '';
          form.elements.content.value = entry.content || '';
          form.querySelector('.consult-cancel').onclick = () => { form.remove(); card.classList.remove('is-editing'); editButton.hidden = false; };
          form.onsubmit = async event => {
            event.preventDefault();
            const content = form.elements.content.value.trim();
            if (!content) { form.querySelector('.consult-error').textContent = '상담 내용을 입력해 주세요.'; return; }
            const buttons = form.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            form.querySelector('.consult-error').textContent = '';
            try {
              const saved = await updateCustomerDiaryEntry(customerId, entry, {title: form.elements.title.value.trim(), date:form.elements.date.value, content});
              Object.assign(entry, saved);
              card.querySelector('.cust-consultation-meta').textContent = formatDate(saved.date || entry.date) + ' · ' + (entry.writer || '');
              card.querySelector('.cust-consultation-title').textContent = saved.title || '(제목 없음)';
              card.querySelector('.cust-consultation-content').textContent = saved.content;
              form.remove(); card.classList.remove('is-editing'); editButton.hidden = false;
              showToast('상담 기록을 저장했습니다. 업무일지에도 반영됩니다.');
              renderCustomerHistory(container,customerId);
              loadCustomers();
            } catch(error) {
              form.querySelector('.consult-error').textContent = error.message;
            } finally { buttons.forEach(b => b.disabled = false); }
          };
          card.appendChild(form);
          form.elements.content.focus();
        };
        container.appendChild(card);
      }
      try {
        const attachments = await getCustomerDiaryAttachments(history.map(h => h.id));
        if (!current()) return;
        for (const row of attachments) {
          const slot = attachmentSlots.get(row.work_diary_id);
          if (!slot) continue;
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'btn cust-attachment';
          button.textContent = (String(row.mime_type || '').startsWith('image/') ? '사진 보기: ' : '파일 열기: ') + (row.original_name || '첨부파일');
          button.onclick = async () => {
            const popup = window.open('about:blank', '_blank');
            if (popup) popup.opener = null;
            button.disabled = true;
            try {
              const url = await getCustomerAttachmentUrl(row);
              if (popup) popup.location.replace(url);
              else showToast('팝업이 차단되었습니다. 팝업을 허용하고 다시 눌러 주세요.');
            } catch(error) { if (popup) popup.close(); showToast(error.message); }
            finally { button.disabled = false; }
          };
          slot.appendChild(button);
        }
      } catch(error) {
        if (current()) {
          const warning = document.createElement('p');
          warning.className = 'consult-error'; warning.textContent = error.message + ' 상담 기록은 정상 표시됩니다.';
          container.appendChild(warning);
        }
      }
    } catch(error) {
      if (current()) container.textContent = '상담 기록 불러오기 실패: ' + error.message;
    }
  }

  async function handleDeleteCustomer(id) {
    if (!confirm("고객을 삭제하시겠습니까?")) return;
    try {
      await deleteCustomer(id);
      showToast("🗑 삭제됨");
      await loadCustomers();
    } catch(e) {
      showToast("❌ 오류: " + e.message);
    }
  }

  let editingCustomerId = null;
  function openCustomerEdit(id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) return;
    editingCustomerId = id;
    setCustomerKinds("ce",customerKinds(c));
    setCustomerContacts("ce",c);
    document.getElementById("ce_name").value    = c.name    || "";
    document.getElementById("ce_contact").value = c.phone   || "";
    document.getElementById("ce_role").value    = c.customer_role || "";
    document.getElementById("ce_type").value    = c.property_category || "";
    document.getElementById("ce_budget").value  = c.desired_price || "";
    document.getElementById("ce_region").value  = c.desired_region || "";
    document.getElementById("ce_memo").value = customerBasicMemo(c);
    document.getElementById("ce_importDetails").innerHTML = customerImportDetails(c);
    mountCustomerMemoForm(document.getElementById("ce_noteComposer"),c,document.getElementById("custEditHistory"));
    document.getElementById("customerEditModal").style.display = "flex";
    renderCustomerProperties(document.getElementById("ce_relatedProperties"),c);
    renderCustomerHistory(document.getElementById("custEditHistory"), id);
  }
  document.getElementById("customerEditSaveBtn").addEventListener("click", async () => {
    if (!editingCustomerId) return;
    const btn = document.getElementById("customerEditSaveBtn");
    btn.disabled = true; btn.textContent = "저장 중...";
    try {
      const phone = document.getElementById("ce_contact").value.trim();
      await updateCustomer(editingCustomerId, {
        name:              document.getElementById("ce_name").value.trim(),
        phone:             phone,
        phone_normalized:  normalizeCustomerPhone(phone),
        customer_types: selectedCustomerKinds("ce"),
        contact_phones: formPhones("ce"),
        additional_contacts: readCustomerContacts("ce"),
        customer_role:     document.getElementById("ce_role").value || null,
        property_category: document.getElementById("ce_type").value || null,
        desired_price:     document.getElementById("ce_budget").value.trim() || null,
        desired_region:    document.getElementById("ce_region").value.trim() || null,
        basic_memo:        document.getElementById("ce_memo").value.trim()
      });
      document.getElementById("customerEditModal").style.display = "none";
      showToast("✅ 수정 완료!");
      await loadCustomers();
    } catch(e) { showToast("❌ 오류: " + e.message); }
    finally { btn.disabled = false; btn.textContent = "저장"; }
  });

  // ⚡ 빠른 고객등록 카드 열기/닫기
  function resetCustomerQuickForm() {
    ["c_name","c_contact","c_budget","c_region","c_memo"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("c_type").value = "";
    document.getElementById("c_contacts").replaceChildren();setCustomerKinds("c",[]);
    document.getElementById("c_role").value = "";
  }
  function closeCustomerQuickCard() {
    document.getElementById("customerQuickCard").style.display = "none";
    document.getElementById("customerAddToggleBtn").textContent = "+ 고객 등록";
  }
  document.getElementById("customerAddToggleBtn").addEventListener("click", () => {
    const card = document.getElementById("customerQuickCard");
    const willOpen = card.style.display === "none";
    card.style.display = willOpen ? "" : "none";
    document.getElementById("customerAddToggleBtn").textContent = willOpen ? "✕ 닫기" : "+ 고객 등록";
    if (willOpen) document.getElementById("c_name").focus();
  });
  document.getElementById("customerCancelBtn").addEventListener("click", () => {
    resetCustomerQuickForm();
    closeCustomerQuickCard();
  });

  document.getElementById("customerSaveBtn").addEventListener("click", async () => {
    const name    = document.getElementById("c_name").value.trim();
    const phone   = document.getElementById("c_contact").value.trim();
    const role    = document.getElementById("c_role").value;
    const type    = document.getElementById("c_type").value;
    const budget  = document.getElementById("c_budget").value.trim();
    const region  = document.getElementById("c_region").value.trim();
    const memo    = document.getElementById("c_memo").value.trim();

    if (!name && !phone) {
      showToast("이름 또는 연락처 중 하나는 입력해주세요");
      return;
    }

    const btn = document.getElementById("customerSaveBtn");
    btn.disabled = true; btn.textContent = "저장 중...";

    try {
      // 같은 연락처의 고객이 이미 있으면 새로 만들지 않고 그 고객을 그대로 쓴다
      // (haitop-realestate-diary의 resolveOrCreateCustomer와 동일한 dedup 기준: phone_normalized).
      const digits = normalizeCustomerPhone(phone);
      let existing = null;
      if (digits) existing = allCustomers.find(c => c.phone_normalized === digits);
      if (existing) {
        showToast(`이미 등록된 고객입니다: ${existing.name || existing.phone} (기존 정보 유지)`);
      } else {
        await addCustomer({
          customer_code: generateCustomerCode(),
          name, phone, phone_normalized: digits,
          customer_types:selectedCustomerKinds("c"),contact_phones:formPhones("c"),additional_contacts:readCustomerContacts("c"),basic_memo:memo,
          customer_role: role || null,
          property_category: type || null,
          desired_price: budget || null,
          desired_region: region || null,
          memo,
          status: "신규"
        });
        showToast("✅ 고객 저장완료!");
      }
      resetCustomerQuickForm();
      closeCustomerQuickCard();
      await loadCustomers();
    } catch(e) {
      showToast("❌ 저장 실패: " + e.message);
    } finally {
      btn.disabled = false; btn.textContent = "💾 고객 저장";
    }
  });

  document.getElementById("customerSearchInput").addEventListener("input", (e) => {
    customerSearch = e.target.value.trim();
    customerPage = 1;
    renderCustomers();
  });

  async function loadCustomers() {
    const container = document.getElementById("customerContainer");
    container.innerHTML = `<div class="loading"><span class="spinner"></span>불러오는 중...</div>`;
    try {
      allCustomers = await getCustomers();
      renderCustomers();
      // 최근업무/최근상담일은 work_diary 조회가 필요해 약간 늦게 채워진다 - 목록은 먼저 보여준다.
      const ids = allCustomers.filter(c => c.status !== "계약완료").map(c => c.id);
      customerDiaryActivity = await getLatestDiaryActivityForCustomers(ids);
      renderCustomers();
    } catch(e) {
      container.innerHTML = `<div class="loading">❌ 불러오기 실패: ${e.message}</div>`;
    }
  }

  // 고객 탭이 기본 진입 화면이므로 페이지 로드 시 미리 불러온다
  loadCustomers().then(() => {
    // 업무일지의 "고객보기" 버튼 등에서 ?tab=customer&customerId=...로 들어오면 상세를 바로 연다
    const qp = new URLSearchParams(location.search);
    const wantCustomerId = qp.get("customerId");
    if (wantCustomerId) {
      openCustomerDetail(wantCustomerId);
      const url = new URL(location.href);
      url.searchParams.delete("customerId");
      url.searchParams.delete("tab");
      history.replaceState({}, "", url.toString());
    }
  });


  document.addEventListener("keydown", event => {
    if (event.key !== "Escape") return;
    ["customerDetailModal","customerEditModal"].forEach(id => document.getElementById(id).style.display = "none");
  });
</script>
</body>
