<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>비밀번호 재설정 - 하이탑부동산</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <script src="assets/js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:radial-gradient(circle at top, var(--panel2) 0, var(--bg) 45%, var(--bg2) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--txt);">
  <div style="width:100%;max-width:320px;">
    <div style="text-align:center;margin-bottom:36px;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#d8b84a,#f0c040);border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:1px solid rgba(216,184,74,0.45);">🏢</div>
      <div style="font-size:1.4rem;font-weight:800;color:var(--gold);letter-spacing:0.5px;">HITOP 부동산</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:4px;">비밀번호 재설정</div>
    </div>

    <div id="loadingState" style="text-align:center;color:var(--sub);font-size:0.88rem;padding:20px 0;">
      링크를 확인하는 중...
    </div>

    <div id="formState" style="display:none;">
      <input id="newPassword" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password"
        style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);outline:none;margin-bottom:10px;" />
      <input id="confirmPassword" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password"
        style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);outline:none;margin-bottom:10px;" />
      <div id="resetError" style="font-size:0.82rem;color:var(--danger);text-align:center;min-height:20px;margin-bottom:10px;"></div>
      <button id="resetBtn" style="width:100%;padding:14px;background:var(--gold);color:#071422;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">비밀번호 변경</button>
    </div>

    <div id="expiredState" style="display:none;text-align:center;">
      <div style="font-size:0.88rem;color:var(--sub);line-height:1.6;margin-bottom:20px;">
        링크가 만료되었습니다. 다시 비밀번호 재설정을 요청하세요.
      </div>
      <button id="goLoginBtn" style="width:100%;padding:14px;background:var(--gold);color:#071422;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">로그인 페이지로 이동</button>
    </div>
  </div>

  <script>
    (function () {
      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const loadingEl = document.getElementById("loadingState");
      const formEl = document.getElementById("formState");
      const expiredEl = document.getElementById("expiredState");
      const newPwEl = document.getElementById("newPassword");
      const confirmPwEl = document.getElementById("confirmPassword");
      const errEl = document.getElementById("resetError");
      const btnEl = document.getElementById("resetBtn");
      const goLoginEl = document.getElementById("goLoginBtn");

      let resolved = false;

      function showExpired() {
        resolved = true;
        loadingEl.style.display = "none";
        formEl.style.display = "none";
        expiredEl.style.display = "block";
      }

      function showForm() {
        if (resolved) return;
        resolved = true;
        loadingEl.style.display = "none";
        expiredEl.style.display = "none";
        formEl.style.display = "block";
        newPwEl.focus();
      }

      // URL(해시/쿼리)에 명시적 오류가 있으면(예: error_code=otp_expired) 곧바로 만료 화면.
      const hashParams = new URLSearchParams((location.hash || "").replace(/^#/, ""));
      const searchParams = new URLSearchParams(location.search || "");
      if (hashParams.has("error") || hashParams.has("error_code") || searchParams.has("error") || searchParams.has("error_code")) {
        showExpired();
        return;
      }

      // 유효한 재설정 링크면 Supabase가 URL을 처리하며 PASSWORD_RECOVERY 이벤트를 보낸다.
      authClient.auth.onAuthStateChange(function (event, session) {
        if (event === "PASSWORD_RECOVERY" && session) showForm();
      });
      // onAuthStateChange가 이미 지나간 이벤트를 놓치는 경우를 대비한 보조 확인.
      authClient.auth.getSession().then(function (res) {
        if (res.data.session) showForm();
      });
      // 일정 시간 안에 유효한 재설정 세션을 확인하지 못하면 만료로 간주한다.
      setTimeout(function () {
        if (!resolved) showExpired();
      }, 4000);

      goLoginEl.addEventListener("click", function () {
        location.replace("login.html");
      });

      async function submitReset() {
        errEl.textContent = "";
        const pw1 = newPwEl.value;
        const pw2 = confirmPwEl.value;
        if (!pw1 || pw1.length < 8) {
          errEl.textContent = "비밀번호는 8자 이상이어야 합니다.";
          return;
        }
        if (pw1 !== pw2) {
          errEl.textContent = "비밀번호가 일치하지 않습니다.";
          return;
        }
        btnEl.disabled = true;
        btnEl.textContent = "변경 중...";
        const { error } = await authClient.auth.updateUser({ password: pw1 });
        if (error) {
          btnEl.disabled = false;
          btnEl.textContent = "비밀번호 변경";
          errEl.textContent = "비밀번호 변경 실패: " + error.message;
          return;
        }
        await authClient.auth.signOut();
        location.replace("login.html?reset=success");
      }

      btnEl.addEventListener("click", submitReset);
      [newPwEl, confirmPwEl].forEach(function (el) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitReset();
        });
      });
    })();
  </script>
</body>
</html>
